<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="${title}">Title</title>
</head>
<body>

<h1 th:text="${title}"></h1>

<ul>
  <li th:text="${user.name}"></li>
  <li th:text="${user.lastName}"></li>

  <li th:if="${user.email != null}" th:text="${user.email}"></li>

</ul>

</body>
</html>
